summary: >-
  Trisotech publishes a single security page rather than a trust centre. It names one
  certification the company itself holds (SOC 2 Type II) and two it inherits from its hosting
  provider (ISO/IEC 27001:2013 and SOC 3, both Google Cloud), states data residency in
  Quebec, and describes its authentication and encryption posture. No report is downloadable
  and there is no NDA-gated document portal.
