name: Trisotech Public API Error Catalog
summary: >-
  Derived from the response tables of all 129 operations in the provider's published API
  reference, plus a live unauthenticated probe that returned a real error body. Trisotech
  does not use RFC 9457 problem+json; it returns a proprietary envelope with an array of
  error objects carrying separate machine and human messages.
format: proprietary
rfc9457: false
media_type: application/json
envelope:
  shape: '{"error":[{"code":"<string>","systemMessage":"<string>","userMessage":"<string>"}]}'
  schema_name: ErrorMessage
  member_schema_name: ErrorMessageErrorInner
  fields:
    - name: code
      description: Machine-readable error identifier. This is the field a client must branch on.
    - name: systemMessage
      description: Technical description intended for logs and developers.
    - name: userMessage
      description: Human-facing message intended for display to an end user.
  note: >-
    The envelope is an ARRAY of errors, so a single response can carry more than one.
status_codes:
  - code: 400
    meaning: Invalid or missing parameters.
    published_messages:
      - Invalid parameters
      - In case of missing or invalid parameters.
      - Invalid or missing information required for migration.
  - code: 401
    meaning: Unauthorized.
    published_messages:
      - Unauthorized
    note: >-
      Declared on a small number of operations only. The observed default for a missing
      bearer token is 500, not 401 — see the probed row below.
  - code: 403
    meaning: Forbidden — the token lacks the grant, or the caller lacks rights on the resource.
    published_messages:
      - An error occurred.
  - code: 404
    meaning: Model, file or resource not found in the given repository, or not accessible.
    published_messages:
      - Model not found or can't be accessed
      - In case when model was not found in given repository.
  - code: 500
    meaning: >-
      The catch-all. Used both for genuine server faults AND for authentication and
      authorization failures, with the real condition carried in error[].code.
    published_messages:
      - An error occurred.
      - Internal server error
    datatype: ErrorMessage
problem_types:
  - code: RequiresLogin
    http_status: 500
    systemMessage: This service requires a User Login
    userMessage: You should Login First
    method: probed
    source: GET https://cloud.trisotech.com/publicapi/user with no Authorization header, 2026-09-02
    remediation: >-
      Obtain a bearer token for a Client App via the OAuth 2 authorization code (or client
      credentials) flow at https://{instance}.trisotech.com/oauth2/token and send it as
      "Authorization: Bearer <token>".
