  distinct_status_codes: [400, 401, 403, 404, 500]
  note: >-
    The 27 code values above are the provider's own closed enum on ErrorMessageErrorInner.
    They are NOT mapped to HTTP status codes anywhere in the published reference, and only
    RequiresLogin was observed on the wire. No code, and no code-to-status mapping, has been
    invented to fill the catalog.
