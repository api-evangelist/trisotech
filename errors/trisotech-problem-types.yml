agent_findings:
  - >-
    HTTP status alone is NOT sufficient to classify a Trisotech API failure. An agent must
    parse error[0].code; a 500 may mean "you are not logged in", which is retryable after
    re-authentication, or a genuine server fault, which is not.
  - >-
    No Retry-After, RateLimit-* or X-RateLimit-* header was present on any observed
    response, so an agent has no runtime backoff signal to read.
  - >-
    Every response carries a request-tracking-identifier header (a UUID) that should be
    captured and quoted in any support request.
coverage:
