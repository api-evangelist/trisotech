- aid: trisotech:automation-api
  name: Trisotech Automation (Service Execution) API
  description: >-
    Every service published to the Trisotech Service Library gets its own REST endpoint and
    its own generated OpenAPI document, built from that service's inputs, outputs and
    characteristics. The endpoint executes a DMN decision service or starts a BPMN process or
    CMMN case instance, and sibling endpoints list and inspect running instances, read and
    write instance data, navigate a case file, reassign user-task resume points, trigger
    instances by message, and search user tasks. A GET returns an input template instead of
    executing, in JSON, XML or HTML form.
  humanURL: https://cloud.trisotech.com/help/service-library/service-rest-api-endpoint.html
  baseURL: https://cloud.trisotech.com/execution
  tags:
  - Workflow-Automation
  - Decision Management
  - Case Management
  tags_raw:
  - Workflow Automation
  - Decision Management
  - Case Management
  properties:
