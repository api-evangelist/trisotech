apis:
- aid: trisotech:public-api
  name: Trisotech Digital Enterprise Suite Public API
  description: >-
    The Public API of the Digital Enterprise Suite — 129 operations across 30 resource groups
    covering modeling places and their content, model promotion change requests, execution
    environments and deployments of BPMN/CMMN/DMN services, data stores, event emitters,
    issues, identities, groups, users, user-task search, test data and AI agents. Protected
    with OAuth 2; every token carries the grants of the Client App that issued it. The API is
    unversioned in its path and served from the customer's own instance host.
  humanURL: https://cloud.trisotech.com/help/des/system-integration/rest-api-documentation.html
