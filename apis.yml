    url: https://cloud.trisotech.com/help/service-library/endpoints.html
  - type: APIReference
    url: https://cloud.trisotech.com/help/service-library/service-execution-rest-api-endpoint.html
  - type: Sandbox
    url: sandbox/trisotech-sandbox.yml
  - type: MCPServer
    url: mcp/trisotech-mcp.yml
- aid: trisotech:graph-sparql
  name: Trisotech Digital Enterprise Graph SPARQL API
  description: >-
    A read-only SPARQL 1.1 endpoint over the Digital Enterprise Graph, the RDF projection of
    every model in a modeling place. One graph exists per place, named
    http://trisotech.com/graph/1.0/graph#<place id>. Requires a licensed Digital Modeling
    Suite with the Digital Enterprise Graph subscription and a Client App holding the graph_r
    and repo_r grants.
  humanURL: https://cloud.trisotech.com/help/digital-modeling-suite/sparql.html
  baseURL: https://cloud.trisotech.com/ds/query
  tags:
  - Knowledge Graph
  - SPARQL
  - Enterprise Architecture
  properties:
  - type: Documentation
    url: https://cloud.trisotech.com/help/digital-modeling-suite/sparql.html
