aid: trisotech
name: Trisotech
description: >-
  Trisotech is a Montreal, Canada software company, founded in 1996, that builds the Digital
  Enterprise Suite — a standards-anchored low-code platform for modelling and automating
  business processes, cases and decisions. Its modelers implement the OMG trio of BPMN 2.0,
  CMMN 1.1 and DMN with FEEL, and its Digital Automation Suite executes those same models as
  live services. Trisotech's founder chairs OMG work on those standards, and the product line
  reflects it: services publish themselves as OpenAPI, as containers, as CDS Hooks discovery
  endpoints and SMART on FHIR applications for healthcare, and as Model Context Protocol
  servers for AI agents. The platform is sold into healthcare, finance and the public sector,
  and the machine-readable surface is a 129-operation OAuth 2 Public API for repository,
  deployment, identity and administration work, plus a per-service Automation API and a SPARQL
  endpoint over the Digital Enterprise Graph.
