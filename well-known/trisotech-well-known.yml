findings:
  - >-
    No security.txt, so the vulnerability-reporting route is prose on a marketing page rather
    than a discoverable RFC 9116 document.
  - >-
    No OAuth/OIDC discovery document, even though the suite runs a full OAuth 2 authorization
    server at https://{instance}.trisotech.com/oauth2/auth and /oauth2/token. A client must
    read the admin documentation to find endpoints that RFC 8414 would have made discoverable.
