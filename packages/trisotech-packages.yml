summary: >-
  Trisotech publishes NO first-party SDK or client library to any public package registry.
  Every registry was queried unauthenticated on 2026-09-02 and the only Trisotech-named
  artifact anywhere is a third-party one maintained by the Red Hat KIE project. The
  integration path Trisotech documents instead is code generation: each published service
  emits its own OpenAPI document, which the customer feeds to Swagger Editor or an API
  gateway to produce a client.
