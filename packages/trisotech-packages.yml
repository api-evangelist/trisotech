finding: >-
  A developer adopting Trisotech gets no maintained client in any language. Because the
  generated OpenAPI is per-service and tenant-specific, the generated client is also
  per-service — there is no stable, versioned library for the 129-operation Public API at
  all. No `SDKs` pointer is wired in apis.yml, because there is no official SDK to point at.
