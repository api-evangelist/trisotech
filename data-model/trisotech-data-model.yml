  - from: ServiceMigrationReport
    kind: has_many
    to: ServiceInstanceMigrationStatus
    via: instance
    confidence: medium
    basis: >-
      A migration report covers the instances migrated.
  - from: AIAgent
    kind: has_many
    to: AIAgentMcpAsToolsInner
    via: mcpAsTools
    confidence: high
    basis: >-
      Published member model name.
  - from: AIAgent
    kind: has_many
    to: AIAgentServicesAsToolsInner
    via: servicesAsTools
    confidence: high
