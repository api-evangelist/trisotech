      The documented emitter attribute `owner` is the 'user defining this emitter'.
  - from: Issue
    kind: has_many
    to: CommentEvent
    via: comment
    confidence: high
    basis: >-
      /issuecomment is a separate resource operating on comments of an issue.
  - from: DataStore
    kind: has_many
